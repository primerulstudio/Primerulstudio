<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Login | RulBandStudio
    </title>

    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>

    <!-- =========================================
         LOGIN WRAPPER
    ========================================== -->

    <div class="login-wrapper">

        <!-- BACKGROUND GLOW -->

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <!-- LOGIN CARD -->

        <div class="login-card">

            <!-- LOGO -->

            <div class="login-logo">

                KHUSUS ADMIN

            </div>

            <!-- TITLE -->

            <h1>
                Welcome Back
            </h1>

            <p>
                Login untuk mengakses dashboard admin.
            </p>

            <!-- ERROR MESSAGE -->

            <div id="errorMessage"></div>

            <!-- LOGIN FORM -->

            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="admin@email.com"
                        required
                    >

                </div>

                <!-- PASSWORD -->

                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                    >

                </div>

                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="login-btn"
                >

                    Login Admin

                </button>

            </form>

        </div>

    </div>

    <!-- =========================================
         SCRIPT
    ========================================== -->

    <script
        type="module"
        src="login.js"
    ></script>

</body>

</html>
